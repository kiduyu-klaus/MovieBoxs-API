# wrangler.toml
name = 'movieboxapi'
main = "src/index.js"
compatibility_date = "2027-01-01"




# Free tier: 100K requests/day, 10ms CPU time (streaming I/O doesn't count)
# The Worker streams video through without buffering → near-zero RAM usage
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
